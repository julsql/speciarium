{% load static %}
<meta name="description" content="{{ seo_page.description }}">
<link rel="canonical" href="{{ seo_canonical }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Speciarium">
<meta property="og:locale" content="fr_FR">
<meta property="og:title" content="{{ seo_page.title }}">
<meta property="og:description" content="{{ seo_page.description }}">
<meta property="og:url" content="{{ seo_canonical }}">
<meta property="og:image" content="{{ seo_image }}">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Logo de Speciarium : un papillon">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ seo_page.title }}">
<meta name="twitter:description" content="{{ seo_page.description }}">
<meta name="twitter:image" content="{{ seo_image }}">
<meta name="twitter:image:alt" content="Logo de Speciarium : un papillon">
{% if seo_json_ld %}<script type="application/ld+json">{{ seo_json_ld }}</script>{% endif %}
